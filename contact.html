<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Attic Experts</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="section section-header">
        <div class="container container-header">
          <div class="logo">
            <img src="./img/LogoS.png" alt="logo" />
            <h2>Attic Experts</h2>
          </div>
          <nav class="nav-header">
            <ul class="nav-header__list">
              <li class="nav-header__item">
                <a href="index.html" class="nav-header__link">Home</a>
              </li>
              <li class="nav-header__item">
                <a href="#" class="nav-header__link">About us</a>
              </li>
              <li class="nav-header__item">
                <a href="#" class="nav-header__link">Services</a>
              </li>
              <li class="nav-header__item">
                <a href="contact.html" class="nav-header__link">Contact us</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="section section-contact">
        <div class="container container-contact">
          <div class="contact-header">
            <p class="hero-eyebrow__text">
              Contact us
              <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M0.75 0.75L9.08333 9.08333M0.75 9.08333H9.08333V0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </p>
          </div>
          <div class="contact-body">
            <form class="contact-form" action="#" method="POST" novalidate>
              <div class="contact-form__group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Smith" required />
              </div>
              <div class="contact-form__group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required />
              </div>
              <div class="contact-form__group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required />
              </div>
              <div class="contact-form__group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell us about your project..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
            <div class="contact-info">
              <div class="contact-info__item">
                <p class="contact-info__label">Phone</p>
                <a href="tel:+14155550000" class="contact-info__value">+1 (415) 555-0000</a>
              </div>
              <div class="contact-info__item">
                <p class="contact-info__label">Email</p>
                <a href="mailto:info@atticexperts.com" class="contact-info__value">info@atticexperts.com</a>
              </div>
              <div class="contact-info__item">
                <p class="contact-info__label">Service Area</p>
                <p class="contact-info__value">Bay Area, California</p>
              </div>
              <div class="contact-info__item">
                <p class="contact-info__label">Hours</p>
                <p class="contact-info__value">Mon – Sat, 8am – 6pm</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
